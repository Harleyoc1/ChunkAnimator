modLoader="javafml"
loaderVersion="${loaderVersionRange}"

issueTrackerURL="https://github.com/Harleyoc1/ChunkAnimator/issues"

license="MIT"

[[mods]]

displayName="Chunk Animator"
modId="${modId}"
version="${modVersion}"

authors="Lumien"
credits="Harley O'Connor for this port"

description='''
A small client side mod that animates the appeareance of chunks so that they don't just instantly appear.
'''

[[mixins]]
config="${modId}.mixins.json"

displayURL="https://www.curseforge.com/minecraft/mc-mods/chunk-animator"
updateJSONURL="https://github.com/Harleyoc1/ChunkAnimator/blob/1.21/version_info.json?raw=true"

[[dependencies.${modId}]]
    modId="neoforge"
    mandatory=true
    versionRange="${forgeVersionRange}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${modId}]]
    modId="minecraft"
    mandatory=true
    versionRange="${mcVersionRange}"
    ordering="NONE"
    side="BOTH"